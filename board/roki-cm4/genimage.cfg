image boot.vfat {
	vfat {
		file config.txt {
			image = "roki-boot/config.txt"
		}
		file cmdline.txt {
			image = "roki-boot/cmdline.txt"
		}
		file cmdline-debug.txt {
			image = "roki-boot/cmdline-debug.txt"
		}
		file start4.elf {
			image = "roki-boot/start4.elf"
		}
		file fixup4.dat {
			image = "roki-boot/fixup4.dat"
		}
		file kernel8.img {
			image = "roki-boot/kernel8.img"
		}
		file bcm2711-roki-head.dtb {
			image = "roki-boot/bcm2711-roki-head.dtb"
		}
	}

	size = 32M
}

image roki-cm4.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
