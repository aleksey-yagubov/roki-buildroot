[General]
EnableNetworkConfiguration=true
# Apply the Russian regulatory domain through cfg80211 on every IWD startup.
Country=RU

[Network]
# IWD runs its built-in DHCP client for address and routes. DNS remains the
# static /etc/resolv.conf below; no resolved or resolvconf daemon is needed.
NameResolvingService=none

[DriverQuirks]
# The robot prioritizes consistent latency over the CM4 Wi-Fi chip's idle power
# savings. Keep power save disabled after every association.
PowerSaveDisable=brcmfmac
